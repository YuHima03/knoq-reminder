services:

  db-temp:
    image: mariadb:11.8
    restart: "no"
    ports:
      - "${MARIADB_EXPOSE_PORT:?}:3306"
    environment:
      MARIADB_USER: ${MARIADB_USER:?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "-h", "localhost", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    mem_limit: 256m
