version: 3

vars:
  DEV_COMPOSE_FILENAME: docker-compose.dev.yml
  DEV_COMPOSE_ENVFILE: .env.dev
  STEP_BEGIN: "\e[36;1m"
  STEP_END: "\e[m"

tasks:
  
  default:
    desc: Print list of available tasks.
    silent: true
    cmd: task -l

  ef-scaffold:
    desc: Scaffold a new DbContext and entity types based on the current database schema.
    vars:
      PROJECT_DIR: src/KnoqReminder.Infrastructure
      DESTINATION_DIR: "{{.PROJECT_DIR}}/Repository"
    sources:
      - "{{.TASKFILE_DIR}}/db/init/*.sql"
    generates:
      - "{{.TASKFILE_DIR}}/{{.DESTINATION_DIR}}/*.cs"
    dir: .
    dotenv:
      - "{{.DEV_COMPOSE_ENVFILE}}"
    preconditions:
      - sh: ls {{.DEV_COMPOSE_FILENAME}}
        msg: required docker-compose file not found.
      - sh: ls {{.DEV_COMPOSE_ENVFILE}}
        msg: required .env file not found.
      - sh: dotnet --version
        msg: dotnet command not found.
      - sh: dotnet ef --version
        msg: Entity Framework Core tools for .NET CLI not found.
    silent: true
    cmds:
      - defer: "echo \"{{.STEP_BEGIN}}[4/4] Terminating...{{.STEP_END}}\" 
                && docker compose --env-file {{.DEV_COMPOSE_ENVFILE}} -f {{.DEV_COMPOSE_FILENAME}} down"
      - "echo \"{{.STEP_BEGIN}}[1/4] Starting temporary database container...{{.STEP_END}}\""
      - docker compose --env-file {{.DEV_COMPOSE_ENVFILE}} -f {{.DEV_COMPOSE_FILENAME}} up --build -d --wait db-temp
      - "echo \"{{.STEP_BEGIN}}[2/4] Scaffolding from localhost:$MARIADB_EXPOSE_PORT/$MARIADB_DATABASE{{.STEP_END}}\""
      - |
        dotnet ef dbcontext scaffold \
          "Server=localhost;Port=$MARIADB_EXPOSE_PORT;Database=$MARIADB_DATABASE;User Id=$MARIADB_USER;Password=$MARIADB_PASSWORD;" \
          "MySql.EntityFrameworkCore" \
          --project {{.PROJECT_DIR}} \
          --output-dir Repository \
          --context AppDbContext \
          --data-annotations \
          --no-onconfiguring \
          --force
      - "echo \"{{.STEP_BEGIN}}[3/4] Formatting generated code...{{.STEP_END}}\""
      - dotnet format --include {{.DESTINATION_DIR}}/*.cs --severity info

  format:
    desc: Format the codebase.
    dir: .
    cmd: dotnet format --severity info
